<section class="page-heading">
  <div>
    <p class="eyebrow">CATÁLOGO</p>
    <h1>Productos</h1>
  </div>

  <div class="contadores">
    <p>Favoritos seleccionados: <strong>{{ favoritos() }}</strong></p>
    <p>Productos en comparación: <strong>{{ comparacion().length }}</strong></p>
  </div>
</section>

<div class="grid">
  @for (producto of productos(); track producto.id) {
    <app-producto-card
      [producto]="producto"
      [destacado]="producto.precio > precioDestacado"
      (verDetalle)="irDetalle($event)"
      (favorito)="registrarFavorito($event)"
      (agregarComparacion)="registrarComparacion($event)" />
  }
</div>
