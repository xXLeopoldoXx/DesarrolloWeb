spring.application.name=proyecto-riesgo

# Puerto del servidor. Si el 8080 está ocupado en tu máquina, usa la variable SERVER_PORT (ej. 8081).
server.port=${SERVER_PORT:8080}

# Base de datos PostgreSQL. La clave se lee de la variable de entorno DB_PASSWORD.
# El valor por defecto es solo un marcador: no escribas aquí tu contraseña real.
spring.datasource.url=jdbc:postgresql://localhost:5432/riesgo_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# CORS: orígenes del frontend Angular autorizados (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT: la clave NO tiene valor por defecto. Debe venir de la variable de entorno JWT_SECRET_BASE64
app.jwt.issuer=riesgo-api
app.jwt.ttl-minutes=30
app.jwt.secret-base64=${JWT_SECRET_BASE64}

# Privacidad: devtools activa por defecto el registro de cada excepción resuelta, y en una validación fallida
# incluye el VALOR rechazado (en el asistente, el texto que escribió la usuaria). Se desactiva explícitamente
# (el prefijo cambió de spring.mvc a spring.webmvc en Spring Boot 4: se declaran ambos).
spring.mvc.log-resolved-exception=false
spring.webmvc.log-resolved-exception=false

# Asistente con IA (Gemini). La clave NUNCA se escribe aquí: variable de entorno GEMINI_API_KEY.
# Sin clave la app arranca igual y el asistente responde "no disponible".
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.timeout-seconds=20
app.asistente.max-mensajes-hora=20
