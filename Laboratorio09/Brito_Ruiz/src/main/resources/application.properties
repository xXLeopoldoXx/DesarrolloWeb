server.port=8082

spring.application.name=tienda

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/productos_db
spring.datasource.username=postgres
spring.datasource.password=root

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuración JWT (Emisor, tiempo de vida y clave en Base64)
app.jwt.issuer=tienda-api
app.jwt.ttl-minutes=30
app.jwt.secret-base64=${JWT_SECRET_BASE64:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JKV1RUb2tlblNwcmluZzIwMjY=}