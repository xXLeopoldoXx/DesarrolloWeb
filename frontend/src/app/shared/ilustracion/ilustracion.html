@switch (nombre()) {
  @case ('apoyo') {
    <!-- Dos mujeres abrazadas bajo un sol suave: acompañamiento y calma -->
    <svg
      viewBox="0 0 480 360"
      [attr.role]="etiqueta() ? 'img' : null"
      [attr.aria-label]="etiqueta() || null"
      [attr.aria-hidden]="etiqueta() ? null : 'true'"
      focusable="false"
    >
      <defs>
        <radialGradient id="ap-sol" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff4d6" />
          <stop offset="0.6" stop-color="#ffd9a0" />
          <stop offset="1" stop-color="#ffb98a" />
        </radialGradient>
      </defs>

      <!-- Sol y halos -->
      <circle class="halo" cx="240" cy="150" r="150" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2" />
      <circle class="halo halo--2" cx="240" cy="150" r="126" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2" />
      <circle cx="240" cy="150" r="104" fill="url(#ap-sol)" />

      <!-- Colinas -->
      <path d="M0 292 Q120 244 240 280 T480 266 V360 H0Z" fill="#2f9a8a" />
      <path d="M0 326 Q150 288 280 322 T480 306 V360 H0Z" fill="#1f6f65" />

      <!-- Plantas -->
      <g class="planta planta--izq">
        <path d="M64 330 C42 282 50 236 72 204 C94 246 88 292 64 330Z" fill="#8edcc9" />
        <path d="M64 330 C92 294 122 276 148 280 C138 312 106 332 64 330Z" fill="#56bba8" />
        <path d="M64 330 C70 290 56 262 30 248 C22 282 34 316 64 330Z" fill="#3aa391" />
      </g>
      <g class="planta planta--der">
        <path d="M424 330 C446 284 438 240 416 210 C394 250 400 294 424 330Z" fill="#8edcc9" />
        <path d="M424 330 C396 296 366 280 342 284 C352 314 384 332 424 330Z" fill="#56bba8" />
        <path d="M424 330 C418 292 432 266 456 254 C466 286 454 316 424 330Z" fill="#3aa391" />
      </g>

      <!-- Mujer de la izquierda: cuerpo ciruela, piel morena, moño -->
      <path d="M138 338 C134 286 150 246 190 242 C228 246 238 286 234 338Z" fill="#9b4f96" />
      <circle cx="190" cy="176" r="13" fill="#2e2030" />
      <circle cx="190" cy="208" r="27" fill="#a86b3d" />
      <path d="M163 208 C161 180 175 170 190 170 C206 170 219 180 217 208 C211 192 201 186 190 186 C179 186 169 192 163 208Z" fill="#2e2030" />
      <path d="M180 210 q5 4.5 10 0 M195 210 q5 4.5 10 0" stroke="#3b2a2a" stroke-width="2.2" fill="none" stroke-linecap="round" />
      <path d="M184 222 q6 5 12 0" stroke="#7a3a2a" stroke-width="2.4" fill="none" stroke-linecap="round" />

      <!-- Mujer de la derecha: cuerpo durazno, piel clara, pelo largo -->
      <path d="M232 338 C228 288 244 248 284 244 C322 248 334 288 330 338Z" fill="#f2a47e" />
      <g class="cabeza-der">
        <path d="M257 212 C251 176 271 164 285 164 C301 164 319 176 313 216 C317 244 313 266 305 272 C301 252 305 228 299 207 C293 192 277 192 271 202 C267 217 267 247 263 264 C255 257 257 232 257 212Z" fill="#6b4630" />
        <circle cx="285" cy="210" r="27" fill="#f3cfa6" />
        <path d="M258 206 C262 184 276 176 285 176 C297 176 308 186 312 206 C304 194 294 190 285 190 C275 190 265 196 258 206Z" fill="#6b4630" />
        <path d="M275 212 q5 4.5 10 0 M290 212 q5 4.5 10 0" stroke="#3b2a2a" stroke-width="2.2" fill="none" stroke-linecap="round" />
        <path d="M279 224 q6 5 12 0" stroke="#b5503e" stroke-width="2.4" fill="none" stroke-linecap="round" />
      </g>

      <!-- Brazo que abraza -->
      <path d="M212 270 C238 252 282 250 316 266" stroke="#a86b3d" stroke-width="15" fill="none" stroke-linecap="round" />
      <circle cx="318" cy="268" r="8" fill="#a86b3d" />

      <!-- Corazones y destellos -->
      <g class="flota" style="--d: 0s">
        <path transform="translate(112 96) scale(1.5)" d="M12 21s-7-4.6-9.5-9C.9 8.4 3 5 6.4 5c2 0 3.6 1.1 4.6 2.7C12 6.1 13.6 5 15.6 5 19 5 21.1 8.4 21.5 12 19 16.4 12 21 12 21z" fill="#f4a3b8" />
      </g>
      <g class="flota" style="--d: 1.4s">
        <path transform="translate(356 70) scale(1.1)" d="M12 21s-7-4.6-9.5-9C.9 8.4 3 5 6.4 5c2 0 3.6 1.1 4.6 2.7C12 6.1 13.6 5 15.6 5 19 5 21.1 8.4 21.5 12 19 16.4 12 21 12 21z" fill="#c9a1e0" />
      </g>
      <g class="flota" style="--d: 2.6s">
        <path transform="translate(372 168) scale(0.9)" d="M12 21s-7-4.6-9.5-9C.9 8.4 3 5 6.4 5c2 0 3.6 1.1 4.6 2.7C12 6.1 13.6 5 15.6 5 19 5 21.1 8.4 21.5 12 19 16.4 12 21 12 21z" fill="#ffd9a0" />
      </g>
      <g class="flota" style="--d: 0.8s">
        <path transform="translate(96 168)" d="M10 0 L12.2 7.8 L20 10 L12.2 12.2 L10 20 L7.8 12.2 L0 10 L7.8 7.8Z" fill="#fff" fill-opacity="0.85" />
      </g>
    </svg>
  }

  @case ('flor') {
    <svg
      viewBox="0 0 120 120"
      [attr.role]="etiqueta() ? 'img' : null"
      [attr.aria-label]="etiqueta() || null"
      [attr.aria-hidden]="etiqueta() ? null : 'true'"
      focusable="false"
    >
      <g class="flor">
        <ellipse cx="60" cy="30" rx="13" ry="26" fill="#c98bc5" />
        <ellipse cx="60" cy="30" rx="13" ry="26" fill="#e3b4de" transform="rotate(60 60 60)" />
        <ellipse cx="60" cy="30" rx="13" ry="26" fill="#f4a3b8" transform="rotate(120 60 60)" />
        <ellipse cx="60" cy="30" rx="13" ry="26" fill="#c98bc5" transform="rotate(180 60 60)" />
        <ellipse cx="60" cy="30" rx="13" ry="26" fill="#e3b4de" transform="rotate(240 60 60)" />
        <ellipse cx="60" cy="30" rx="13" ry="26" fill="#f4a3b8" transform="rotate(300 60 60)" />
        <circle cx="60" cy="60" r="13" fill="#ffd9a0" />
      </g>
    </svg>
  }

  @case ('hojas') {
    <svg
      viewBox="0 0 160 120"
      [attr.role]="etiqueta() ? 'img' : null"
      [attr.aria-label]="etiqueta() || null"
      [attr.aria-hidden]="etiqueta() ? null : 'true'"
      focusable="false"
    >
      <g class="planta">
        <path d="M80 116 C56 80 60 40 82 8 C104 46 100 82 80 116Z" fill="#8edcc9" />
        <path d="M80 116 C110 88 138 76 156 82 C146 106 118 120 80 116Z" fill="#56bba8" />
        <path d="M80 116 C82 90 64 70 40 64 C32 90 48 110 80 116Z" fill="#3aa391" />
      </g>
    </svg>
  }
}
