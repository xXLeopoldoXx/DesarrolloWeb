spring.application.name=proyecto-riesgo

# Base de datos PostgreSQL (la clave se lee de la variable DB_PASSWORD; si no existe, usa el valor por defecto)
spring.datasource.url=jdbc:postgresql://localhost:5432/riesgo_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:30334006}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT: la clave NO tiene valor por defecto. Debe venir de la variable de entorno JWT_SECRET_BASE64
app.jwt.issuer=riesgo-api
app.jwt.ttl-minutes=30
app.jwt.secret-base64=${JWT_SECRET_BASE64}
