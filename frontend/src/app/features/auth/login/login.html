<app-auth-layout titulo="Iniciar sesión" subtitulo="Entra a tu espacio seguro.">
  <form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
    @if (error()) {
      <div class="alerta alerta--error" role="alert">{{ error() }}</div>
    }

    <div class="campo">
      <label for="username">Usuario</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" autocapitalize="none" />
      @if (formulario.controls.username.touched && formulario.controls.username.invalid) {
        <span class="error">Escribe tu usuario.</span>
      }
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (formulario.controls.password.touched && formulario.controls.password.invalid) {
        <span class="error">Escribe tu contraseña.</span>
      }
    </div>

    <button type="submit" class="boton boton--bloque" [disabled]="cargando()">
      {{ cargando() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="pie">¿Primera vez aquí? <a routerLink="/registro">Crea tu cuenta</a></p>
</app-auth-layout>
