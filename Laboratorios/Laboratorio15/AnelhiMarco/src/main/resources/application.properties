spring.application.name=tienda-utp-laboratorio15
server.address=127.0.0.1
server.port=${LAB15_API_PORT:8080}

spring.datasource.url=jdbc:postgresql://${LAB15_DB_HOST:127.0.0.1}:${LAB15_DB_PORT:5432}/tienda_lab15_anelhi
spring.datasource.username=${LAB15_DB_USER}
spring.datasource.password=${LAB15_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.issuer=tienda-lab15
app.jwt.ttl-minutes=30
app.jwt.secret-base64=${LAB15_JWT_SECRET_BASE64}
