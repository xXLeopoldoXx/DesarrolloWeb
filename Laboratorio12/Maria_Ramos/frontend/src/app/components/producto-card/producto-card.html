<article class="tarjeta">
  <span class="categoria">{{ producto().categoria }}</span>

  <h2>{{ producto().nombre }}</h2>

  <p class="descripcion">
    {{ producto().descripcion }}
  </p>

  <p class="precio">
    {{ producto().precio | currency:'PEN':'S/ ' }}
  </p>

  <div class="acciones">
    <button
      type="button"
      class="btn-detalle"
      (click)="mostrarDetalle()">
      Ver detalle
    </button>

    <button
      type="button"
      class="btn-favorito"
      (click)="agregarFavorito()">
      Favorito
    </button>
  </div>
</article>
